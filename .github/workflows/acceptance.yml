name: 业务合并检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RATCHET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: 确认网易云子模块已检出
        run: test -f vendor/api-enhanced/module/search.js
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: 安装锁文件依赖及 Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium
      - name: 前端分层与文件行数门禁
        run: pnpm lint
      - name: 依赖安全门禁
        run: |
          mkdir -p artifacts/security
          pnpm audit --registry=https://registry.npmjs.org --audit-level=high --json > artifacts/security/audit.json
      - name: 构建、业务测试与覆盖率
        run: pnpm verify:baseline
      - name: 保存业务验收结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/baseline/
            artifacts/security/
            artifacts/e2e/report/
            artifacts/e2e/results/
            artifacts/e2e/results.json
            coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  merge-gate:
    name: merge-gate
    if: always()
    needs: [business]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 汇总必需检查
        env:
          BUSINESS_RESULT: ${{ needs.business.result }}
        run: node scripts/ci-merge-gate.cjs
