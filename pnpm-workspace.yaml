packages:
  - '.'
  - 'frontend'
  - 'vendor/api-enhanced'

allowBuilds:
  bcrypt: true
  better-sqlite3: true
  core-js: true
  esbuild: true
  es5-ext: true

minimumReleaseAgeExclude:
  - nodemailer@10.1.2

# 统一修复直接和传递依赖；未发布修复版的漏洞仍由安全门禁阻断。
overrides:
  'proxy-addr@<2.0.8': 2.0.8
  'shell-quote@>=1.8.4 <1.11.0': 1.12.0
  'serialize-javascript@<=7.0.2': 7.1.2
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.21
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.12
  'basic-ftp@<=6.2.0': 6.2.3
  'source-map-js@<1.2.2': 1.2.2
  'follow-redirects@>=1.16.0 <1.16.1': 1.16.1
  'vite@>=7.0.0 <7.3.7': 7.3.7
